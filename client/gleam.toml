name = "mindfulness_client"
version = "0.1.0"

# Target JavaScript for the Browser and Capacitor
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.40.0"
lustre = ">= 5.6.0"          # The main web framework
lustre_websocket = ">= 0.9.0" # For Cartesia streaming
gleam_json = ">= 1.0.0"      # For parsing TTS messages
effect = ">= 2.2.2 and < 3.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0"        # For your isolated logic tests
lustre_dev_tools = ">= 2.0.0"
