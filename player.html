<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Seamless TTS Streamer</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            background: #f1f5f9;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        textarea,
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        #playBtn {
            background: #0f172a;
            color: white;
            grid-column: span 2;
        }

        #downloadBtn {
            background: #10b981;
            color: white;
            display: none;
        }

        button:disabled {
            background: #94a3b8;
            transform: none;
        }

        .monitor {
            margin-top: 30px;
            text-align: center;
        }

        .buffer-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #fill {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #status {
            font-size: 0.9rem;
            color: #475569;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Premium TTS Streamer</h2>
        <label>Voice Persona</label>
        <input type="text" id="desc" value="Realistic male voice, Irish accent, slow pacing.">
        <label>Text to Generate</label>
        <textarea id="text" rows="3">Hello. This audio is being buffered and recorded in high quality.</textarea>

        <div class="controls">
            <button id="playBtn">Start Generation</button>
            <button id="downloadBtn">Download HQ WebM</button>
        </div>

        <div class="monitor">
            <div class="buffer-bar">
                <div id="fill"></div>
            </div>
            <span id="status">Ready</span>
        </div>
    </div>

    <script>
        const processorCode = `
class StreamProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.buffer = new Float32Array(240000); 
        this.readPtr = 0; this.writePtr = 0; this.count = 0;
        this.isStarted = false;
        // 2-second initial buffer for rock-solid stability
        this.startThreshold = 48000; 

        this.port.onmessage = (e) => {
            for (let i = 0; i < e.data.length; i++) {
                this.buffer[this.writePtr] = e.data[i];
                this.writePtr = (this.writePtr + 1) % this.buffer.length;
                this.count++;
            }
        };
    }

    process(inputs, outputs) {
        const output = outputs[0][0];
        
        if (!this.isStarted && this.count >= this.startThreshold) {
            this.isStarted = true;
            this.port.postMessage({ type: 'status', value: 'Streaming' });
        }

        if (this.isStarted) {
            if (this.count >= output.length) {
                // Determine playback speed based on buffer health
                // If buffer is low (< 0.5s), we could technically slow down, 
                // but standard Web Audio Worklets need manual resampling.
                // For now, we focus on a rigid "Wait for Safety" model.
                for (let i = 0; i < output.length; i++) {
                    output[i] = this.buffer[this.readPtr];
                    this.readPtr = (this.readPtr + 1) % this.buffer.length;
                    this.count--;
                }
            } else {
                this.isStarted = false;
                this.port.postMessage({ type: 'status', value: 'Network Lag - Rebuffering...' });
            }
        }

        this.port.postMessage({ type: 'buffer', value: this.count });
        return true;
    }
}
registerProcessor('stream-processor', StreamProcessor);
`;

        let audioCtx, streamNode, mediaRecorder, chunks = [];

        async function setup() {
            audioCtx = new AudioContext({ sampleRate: 24000 });
            const blob = new Blob([processorCode], { type: 'application/javascript' });
            await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));

            streamNode = new AudioWorkletNode(audioCtx, 'stream-processor');
            const dest = audioCtx.createMediaStreamDestination();

            mediaRecorder = new MediaRecorder(dest.stream);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const url = URL.createObjectURL(new Blob(chunks, { type: 'audio/webm' }));
                document.getElementById('downloadBtn').style.display = 'block';
                document.getElementById('downloadBtn').onclick = () => {
                    const a = document.createElement('a'); a.href = url; a.download = 'high-quality-tts.webm'; a.click();
                };
            };

            streamNode.connect(audioCtx.destination);
            streamNode.connect(dest);

            streamNode.port.onmessage = (e) => {
                if (e.data.type === 'buffer') {
                    const percent = (e.data.value / 48000) * 100;
                    document.getElementById('fill').style.width = Math.min(percent, 100) + '%';
                } else if (e.data.type === 'status') {
                    document.getElementById('status').innerText = e.data.value;
                }
            };
        }

        document.getElementById('playBtn').onclick = async () => {
            if (!audioCtx) await setup();
            audioCtx.resume();
            const btn = document.getElementById('playBtn');
            btn.innerText = "Generating...";
            btn.disabled = true;
            chunks = [];
            document.getElementById('downloadBtn').style.display = 'none';
            mediaRecorder.start();

            try {
                const response = await fetch('https://maya1-tts-434000853810.europe-west1.run.app/v1/tts/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        description: document.getElementById('desc').value,
                        text: document.getElementById('text').value,
                        stream: true,
                        max_words_per_chunk: 30,
                    })
                });

                const reader = response.body.getReader();
                let leftOver = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    let data = value;
                    if (leftOver) {
                        let combined = new Uint8Array(leftOver.length + data.length);
                        combined.set(leftOver); combined.set(data, leftOver.length);
                        data = combined; leftOver = null;
                    }
                    if (data.length % 2 !== 0) {
                        leftOver = data.slice(-1);
                        data = data.slice(0, -1);
                    }

                    const i16 = new Int16Array(data.buffer, data.byteOffset, data.length / 2);
                    const f32 = new Float32Array(i16.length);
                    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
                    streamNode.port.postMessage(f32);
                }

                setTimeout(() => {
                    mediaRecorder.stop();
                    btn.disabled = false;
                    btn.innerText = "Start Generation";
                    document.getElementById('status').innerText = "Complete";
                }, 5000);
            } catch (e) { alert("API Connection Failed: " + e); btn.disabled = false; }
        };
    </script>
</body>

</html>
