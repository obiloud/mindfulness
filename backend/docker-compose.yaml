version: '3.8'

services:
  # Agent A: Chat & UI Gateway (Requester)
  chat-agent:
    build: 
      context: .
      dockerfile: ./agent_a_chat/Dockerfile
    container_name: pulse-chat-agent
    ports:
      - "8000:8000"
    environment:
      - SYNTH_AGENT_URL=http://synth-agent:8001
      - DATABASE_URL=postgresql://guru:changeme12345@postgres:5432/mindfulness
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Agent B: Meditation Synthesizer (Producer)
  synth-agent:
    build:
      context: .
      dockerfile: ./agent_b_synth/Dockerfile
    container_name: pulse-synth-agent
    environment:
      - DATABASE_URL=postgresql://guru:changeme12345@postgres:5432/mindfulness
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - A2A_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: mindfulness
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: changeme12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "guru", "-d", "mindfulness"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: