<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya1 TTS POC</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            background: #ccc;
        }

        #status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>

<body>
    <script>
        (async () => {
            if (!navigator.gpu) {
                console.log("WebGPU is NOT supported in this browser.");
            } else {
                const adapter = await navigator.gpu.requestAdapter();
                console.log("✅ WebGPU is supported!", adapter);
            }
        })();
    </script>
    <script src="https://unpkg.com/wasm-feature-detect/dist/umd/index.js"></script>

    <h1>Maya1 Voice Agent</h1>

    <div class="field">
        <label>Voice Description</label>
        <input type="text" id="description" value="Realistic male voice, British accent, slow pacing.">
    </div>

    <div class="field">
        <label>Text to Speech</label>
        <textarea id="ttsText"
            rows="4">Hello! I am decoding SNAC tokens directly in your browser. This reduces server load and improves latency.</textarea>
    </div>

    <button id="playBtn">Generate & Play</button>
    <div id="status">Ready</div>

    <script>
        let snacNode;
        let audioCtx;
        let mediaRecorder;
        let recordedChunks = [];

        // 1. Initialize Worker ONCE at page load
        const snacWorker = new Worker('snac-worker.js');

        // 2. Wrap initialization in an async function to allow 'await'
        async function initSystem() {
            try {
                // Check for SIMD support (required to fix the 630ms lag)
                const hasSimd = await wasmFeatureDetect.simd();
                console.log("Main Thread SIMD Check:", hasSimd);

                // Tell worker to load the model with the correct SIMD flag
                snacWorker.postMessage({
                    type: 'INIT',
                    modelUrl: './snac_decoder_24khz.onnx',
                    hasSimd: hasSimd
                });
            } catch (e) {
                console.error("Initialization failed:", e);
            }
        }

        // Call the init function immediately
        initSystem();

        // 2. Handle incoming audio from Worker
        snacWorker.onmessage = (e) => {
            if (e.data.type === 'PCM_DATA') {
                if (snacNode) {
                    snacNode.port.postMessage({ type: 'PCM_DATA', data: e.data.data });
                    // If you still see 700ms+ here, the M2 is throttling the Worker
                    console.log(`Worker decode: ${e.data.time}ms`);
                }
            }
        };

        async function startVoiceStream() {
            const status = document.getElementById('status');
            const btn = document.getElementById('playBtn');

            try {
                btn.disabled = true;

                // Setup Audio once
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                        sampleRate: 24000,
                        latencyHint: "playback"
                    });
                    await audioCtx.audioWorklet.addModule('snac-processor.js');
                    snacNode = new AudioWorkletNode(audioCtx, 'snac-processor');

                    // Filter Chain
                    const lowPass = audioCtx.createBiquadFilter();
                    lowPass.type = 'lowpass';
                    lowPass.frequency.value = 8500;

                    const highShelf = audioCtx.createBiquadFilter();
                    highShelf.type = 'highshelf';
                    highShelf.frequency.value = 5000;
                    highShelf.gain.value = 3;

                    snacNode.connect(lowPass);
                    lowPass.connect(highShelf);
                    highShelf.connect(audioCtx.destination);

                    // Debug Recording Setup
                    const dest = audioCtx.createMediaStreamDestination();
                    snacNode.connect(dest);
                    mediaRecorder = new MediaRecorder(dest.stream);
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = 'debug_audio.wav';
                        document.body.appendChild(a); a.click();
                    };
                }

                if (audioCtx.state === 'suspended') await audioCtx.resume();

                const response = await fetch('https://maya1-tts-434000853810.europe-west1.run.app/v1/tts/tokens', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        description: document.getElementById('description').value,
                        text: document.getElementById('ttsText').value,
                        stream: true
                    })
                });

                const reader = response.body.getReader();
                recordedChunks = [];
                mediaRecorder.start();

                const decoder = new TextDecoder();
                let buffer = '';
                status.innerText = "Streaming and Decoding...";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (let line of lines) {
                        if (!line.trim()) continue;
                        try {
                            let sanitized = line.trim();
                            if (sanitized.startsWith('"')) sanitized = JSON.parse(sanitized);
                            const packet = typeof sanitized === 'string' ? JSON.parse(sanitized) : sanitized;

                            if (packet.type === 'tokens') {
                                // Send to worker and move on immediately
                                snacWorker.postMessage({ type: 'DECODE', tokens: packet.data });
                            }
                        } catch (e) {
                            console.error("JSON Error:", e);
                        }
                    }
                }
                status.innerText = "Playback Complete.";
            } catch (err) {
                console.error("Critical Error:", err);
                status.innerText = "Error: " + err.message;
            } finally {
                btn.disabled = false;
                if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            }
        }

        document.getElementById('playBtn').addEventListener('click', startVoiceStream);
    </script>
</body>

</html>
