version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: mindfulness
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: changeme12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "guru", "-d", "mindfulness"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Comment: Health check ensures PostgreSQL is ready before application starts

volumes:
  postgres_data: