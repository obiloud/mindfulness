services:
  # Agent A: Chat & UI Gateway (Requester)
  chat-agent:
    build: 
      context: .
      dockerfile: ./backend/agent_a_chat/Dockerfile
    container_name: pulse-chat-agent
    ports:
      - "8000:8000"
    develop:
      watch:
        - path: ./backend/agent_a_chat
          action: rebuild
    environment:
      - SYNTH_AGENT_URL=http://synth-agent:8001
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING}
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      synth-agent:
        condition: service_healthy
    restart: unless-stopped

  # Agent B: Meditation Synthesizer (Producer)
  synth-agent:
    build:
      context: .
      dockerfile: ./backend/agent_b_synth/Dockerfile
    container_name: pulse-synth-agent
    develop:
      watch:
        - path: ./backend/agent_b_synth
          action: rebuild
    environment:
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING}
      - HF_TOKEN=${HF_TOKEN}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - A2A_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/.well-known/agent-card.json')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL with pgvector extension pre-installed
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: